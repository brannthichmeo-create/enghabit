<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Enghabit">
  <!--
    Mốc thu gọn dùng cho favicon và header.

    Linh vật đầy đủ có chân tay mảnh nên dưới 32px chỉ còn là một vệt màu.
    Mốc này giữ lại đúng ba yếu tố nhận diện của logo — nền xanh ngọc, cái loa vàng,
    nét vẽ navy — với hình khối đủ lớn để đọc được ở 16px.
  -->
  <rect width="64" height="64" rx="15" fill="#5AE0E1"/>

  <g stroke="#1A2433" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Thân loa -->
    <path d="M40.5 21.5 18 30.5 40.5 43z" fill="#FBBC1F"/>
    <!-- Miệng loa -->
    <path d="M18 30.5c-3.2 1.1-3.2 5.2 0 6.3" fill="none"/>
    <!-- Ống cầm -->
    <path d="M40.5 21.5c4 2.6 4 18.4 0 21.5" fill="#FBBC1F"/>
  </g>

  <!-- Vạch âm thanh phát ra, gợi ý hành động "nhắc nhở học" -->
  <g stroke="#1A2433" stroke-width="3.2" stroke-linecap="round">
    <path d="M48.5 26.5c2.6 3.4 2.6 10.6 0 14"/>
    <path d="M54.5 22.5c4.4 5.4 4.4 17.6 0 22"/>
  </g>
</svg>
