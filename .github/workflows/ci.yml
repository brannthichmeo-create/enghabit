name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # shared phải build trước vì be/fe import từ bản dist
      - run: pnpm build:shared

      - name: Generate Prisma Client
        run: pnpm --filter @enghabit/be db:generate

      - name: Typecheck
        run: |
          pnpm --filter @enghabit/be typecheck
          pnpm --filter @enghabit/fe typecheck

      # Thiếu bản dịch không làm vỡ giao diện (câu đó hiện tiếng Việt) nên nếu không
      # chặn ở đây thì sẽ không bao giờ có ai phát hiện ra.
      - name: Kiểm tra bản dịch
        run: pnpm --filter @enghabit/fe check:i18n

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
