# Cấu hình deploy backend lên Render.
#
# Đây là monorepo pnpm nên phải build `shared` trước, vì `be` import từ bản dist
# của nó — build thẳng `be` sẽ lỗi không tìm thấy @enghabit/shared.
services:
  - type: web
    name: enghabit-api
    runtime: node
    plan: free
    region: singapore
    # Không dùng `corepack enable`: nó cố tạo/ghi lại shim trong /usr/bin,
    # nơi hệ thống file của Render là read-only. Corepack chạy pnpm trực tiếp,
    # không ghi vào thư mục hệ thống.
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @enghabit/shared build && corepack pnpm --filter @enghabit/be build
    startCommand: corepack pnpm --filter @enghabit/be start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Các biến còn lại đặt trong bảng điều khiển Render, KHÔNG ghi vào file này:
      #   DATABASE_URL      chuỗi kết nối Aiven, nhớ kèm ?connection_limit=5&sslaccept=strict
      #   CORS_ORIGIN       tên miền Vercel, ví dụ https://enghabit.vercel.app
      #   JWT_ACCESS_SECRET, JWT_REFRESH_SECRET   chuỗi ngẫu nhiên dài, mỗi cái một giá trị
      #   ENABLE_REMINDER_JOB=false   gói free bị ngủ khi không có request nên cron không đáng tin

