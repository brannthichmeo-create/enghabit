# Cau hinh deploy backend len Render.
#
# Monorepo pnpm: build shared truoc vi backend import ban dist cua shared.
services:
  - type: web
    name: enghabit-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npx --yes pnpm@9.15.4 install --frozen-lockfile && npx --yes pnpm@9.15.4 --filter @enghabit/shared build && npx --yes pnpm@9.15.4 --filter @enghabit/be build
    startCommand: npx --yes pnpm@9.15.4 --filter @enghabit/be start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
