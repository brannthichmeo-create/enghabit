# Cau hinh deploy backend len Render.
#
# Monorepo pnpm: build shared truoc vi backend import ban dist cua shared.
services:
  - type: web
    name: enghabit-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @enghabit/shared build && corepack pnpm --filter @enghabit/be build
    startCommand: corepack pnpm --filter @enghabit/be start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.5
