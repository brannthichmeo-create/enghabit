# Cấu hình deploy backend lên Render.
#
# Đây là monorepo pnpm nên phải build `shared` trước, vì `be` import từ bản dist
# của nó — build thẳng `be` sẽ lỗi không tìm thấy @enghabit/shared.
services:
  - type: web
    name: enghabit-api
    runtime: node
    plan: free
    region: singapore
    # Hai chỗ trong lệnh này không được bỏ:
    #
    # `--install-directory "$HOME/.bin"` — `corepack enable` trần sẽ ghi symlink vào
    # /usr/bin, mà thư mục đó chỉ đọc trên Render và đã có sẵn pnpm. Lỗi báo ra là
    # "EROFS: read-only file system, unlink '/usr/bin/pnpm'". Vẫn cần corepack chứ
    # không dùng thẳng pnpm của Render: lockfile là lockfileVersion 9.0 nên bắt buộc
    # pnpm 9+, còn corepack lấy đúng bản ghi ở "packageManager" của package.json.
    #
    # `--prod=false` — NODE_ENV=production ở dưới làm pnpm bỏ qua devDependencies,
    # mà build cần tsup, typescript và prisma. Thiếu cờ này thì build đỏ với
    # "tsup: not found" ngay bước đầu.
    buildCommand: mkdir -p "$HOME/.bin" && corepack enable --install-directory "$HOME/.bin" && export PATH="$HOME/.bin:$PATH" && pnpm install --frozen-lockfile --prod=false && pnpm --filter @enghabit/shared build && pnpm --filter @enghabit/be build
    # `start` của be làm ba việc, đúng thứ tự đó và không đổi được:
    #
    #   1. prisma migrate deploy      — schema khớp code trước khi mở cổng
    #   2. seed-shop.js --soft        — nạp danh mục cửa hàng (migration tạo BẢNG, không
    #                                   mang DỮ LIỆU, nên thiếu bước này là push git xong
    #                                   cửa hàng trên production vẫn rỗng)
    #   3. node dist/server.js        — mở cổng
    #
    # `--soft` là bắt buộc: ba lệnh nối bằng `&&`, không có nó thì một lỗi DB tạm thời lúc
    # nạp danh mục sẽ chặn luôn bước 3 và cả API sập chỉ vì mấy con linh vật.
    startCommand: pnpm --filter @enghabit/be start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Corepack hỏi xác nhận trước khi tải pnpm về lần đầu. Build chạy không có
      # bàn phím nên câu hỏi đó chỉ làm treo hoặc dừng build.
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      # Các biến còn lại đặt trong bảng điều khiển Render, KHÔNG ghi vào file này:
      #   DATABASE_URL      chuỗi kết nối Aiven, kèm ?connection_limit=5&connect_timeout=15
      #                     (xem docs/aiven-setup.md — đừng thêm sslaccept=strict nếu thiếu ca.pem)
      #   CORS_ORIGIN       tên miền Vercel, ví dụ https://enghabit.vercel.app
      #   JWT_ACCESS_SECRET, JWT_REFRESH_SECRET   chuỗi ngẫu nhiên dài, mỗi cái một giá trị
      #   ENABLE_REMINDER_JOB=false   gói free bị ngủ khi không có request nên cron không đáng tin
